# 直播互动 Agent 配置示例
#
# 复制为 config.yaml 后再填写真实值。config.yaml 已在 .gitignore 中忽略，
# 不要把 API key、Cookie 或账号 uid 提交到公开仓库。

llm:
  provider: deepseek
  # DeepSeek 的 OpenAI 兼容入口（官方文档：https://api.deepseek.com）
  base_url: https://api.deepseek.com
  api_key: ""  # 填写你的 API key
  model: deepseek-flash
  temperature: 0.8
  # 注意：思考模式消耗的 token 也算在这个额度里。
  # 实测 max_tokens=100 时模型把额度全花在思考上，输出为空；
  # 弹幕回复本身很短，但要给思考留足空间，所以给 800。
  max_tokens: 0        # 0 = 不限制，交给服务端默认上限（思考模式会吃 token，限制容易截断）
  timeout: 60

  # 思考程度。默认 low；可选 low / medium / high。
  # 该值会以 thinking_depth 字段发给模型（网关与 DeepSeek 均接受此字段，
  # 不支持的实现会忽略它，不影响调用）。
  thinking:
    enabled: true
    param: thinking_depth
    value: low

reply:
  # 弹幕长度是按"加权单位"算的，实测规则：汉字 1 个单位、英文字母 0.5 个，
  # 上限 40 个单位（= 40 个汉字，或 80 个英文字母）。见研究记录 2.4 节。
  hard_limit_units: 40
  # 给模型的"建议"长度：弹幕越短越像真人，也更安全。
  target_chars: 25

  # 这段只覆盖「普通观众」(normal) 人设的风格段；切到其它人设后不生效。
  # 「小助手」身份和不可变底线在 agent/personas.py 里写死，这里改不了。
  persona: |
    你是一个 B 站直播间的老观众，不是助手、不是客服。
    你说话简短、口语化，像弹幕一样自然，可以带一点点网感。
    不要用书面语，不要列点，不要解释自己。
    不确定的事就说不知道或者直接岔开，绝不编造事实。

  # 机器人自己的账号昵称。观众 @ 这个昵称就会命中 mention 触发。
  # 当前机器人是「示例机器人」这个号，所以写成它的昵称。
  bot_name: 示例机器人
  # 机器人自己的 uid。上下文里要靠它区分"我上一句"和别人的话
  # （房管脚本也是 is_bot，但那些不能当成"我说的"）。
  bot_uid: 1000000001

triggers:
  # 测试阶段：只有弹幕里出现 question 这个词才触发（魔法词模式）。
  # 这样做的好处是触发时机完全可控，不会因为观众随便问一句就被触发。
  keywords: [question]
  # 叫名字就应答（弹幕或主播语音里出现这些名字即触发）
  names: [小助手]
  # 同一个人多少秒内重复触发只回第一条
  trigger_cooldown_s: 5

  # 是否启用"问句自动触发"（句尾问号 / 吗 / 怎么 / 为什么 等）。
  # 测试阶段关闭，避免不可控触发；稳定后再打开。
  question_regex: false

  # 哪些事件类型参与决策
  types: [danmaku, gift, superchat, speech]
  # 回放时两条候选之间的最小间隔（秒），模拟真实发送节奏
  min_interval_s: 30

guard:
  # 内容级护栏（决策时判定，不通过就不入队）
  duplicate_threshold: 0.8
  # 注：以上阈值只作用于**机器人自己的**回复（避免复读）。
  # 手动发送不做重复检查——人重复说是正常行为。

# 上下文组装：近场弹幕 + 知识库 + 历史语义检索
context:
  # 检索几条历史进提示词
  history_top_k: 6
  # 相似度下限。低于它的历史一律不进上下文——没有下限时，
  # 问"量子力学怎么解"这类跟直播间无关的问题，也会被硬塞 6 条
  # "最不相关"的内容，反而诱导模型把不相干的事当成直播间八卦说出来。
  # 0.55 是用回放数据标定的：相关命中普遍 0.6+，无关问题最高只到 0.43。
  min_score: 0.55
  # 知识库维护节拍（秒）：批量抽取直播间事实/话题 + 压本场滚动摘要，
  # 两件事共用这个间隔（<=0 关闭）。太短浪费调用，太长则开场内容记不住。
  summary_interval_s: 300
  # 自上次摘要之后至少攒够多少条新增事件才值得压一次。
  # 实测本房间密度约 7 条事件/分钟：定 40 时 5 分钟只有 ~35 条，
  # 每轮都被挡下、实际变成 10 分钟一次 → 调到 20。
  # 两件事都是"自上次以来的增量"，调低只会让它每轮都干活，不会重复概括。
  summary_min_events: 20
  # 本场摘要的字数上限；超了让模型再压一次（而不是砍掉开头）
  summary_keep_chars: 2000

  # 批量抽取直播间事实 / 本场话题 / 房间黑话。
  # 这条路**不依赖主播叫机器人名字**（语音触发只认名字，主播不会天天报备
  # "我明天不播"，所以原来那三个区段基本永远是空的）。
  # 主播说了至少这么多句，才值得跑一次抽取（同上，原 20 在安静时段常被跳过）
  extract_min_lines: 12
  # 单次最多新增/更新几条事实（key 沿用已有的话是更新，不是新增）
  extract_max_facts: 3
  # 每个房间每天最多留多少条抽取出的事实/黑话（防跑飞）
  extract_daily_limit: 40

  # 人物卡：每场直播只刷新一次（第一个知识库节拍时跑一批），不再每 30 分钟轮转。
  # 每张卡都会带上旧卡内容做增量更新，模型漏填的字段沿用旧值，不会整张清空。
  people_once_per_session: true
  # 单场最多更新多少张；0 = top 60 全刷。现有 56 张卡按 20/场约 3 场覆盖一轮。
  people_refresh_max: 20
  # 仅 people_once_per_session: false 的旧节拍模式使用：
  people_refresh_every: 6
  people_stale_hours: 12

# 看门狗：采集进程死了要能发现（否则表现只是"界面上没动静"）
watchdog:
  enabled: true
  # 检查间隔
  check_interval_s: 30
  # 判据是"日志文件多久没有增长"（不是"多久没解析到事件"）：
  # 后者在"采集进程启动就崩"时永远为空，等于哑巴——实测踩过。
  # 两个采集脚本都会定期写心跳（弹幕每 60 秒、转录每 30 秒），
  # 所以阈值取 180 秒 = 允许漏掉 3~6 次心跳，不会误报。
  danmaku_silence_s: 180
  speech_silence_s: 180

# 发送队列：限速与生命周期由队列负责，不再在决策时拒绝
send:
  min_interval_s: 3      # 两条弹幕之间至少间隔 3 秒
  per_minute: 8          # 每分钟最多 8 条
  ttl_s: 60              # 每条消息在队列里最多存活 60 秒，超时丢弃

clean:
  # 机器人账号：它们的发言会照常入库，但打上 is_bot 标记，
  # 不计入观众画像，也不作为回复对象。
  bot_uids:
    - 1000000003    # 示例房管（房管自动回复脚本）
    - 1000000001          # 机器人自己的号（示例机器人），避免把自己的回复当观众发言
  bot_nicknames: [示例房管, 示例机器人]

  # 模板兜底：昵称/uid 变了也能识别（这些是房管脚本的话术特征）
  bot_reply_patterns:
    - "欢迎.*捕捉一只小可爱"
    - "念对了才有奖励"
    - "晚上好呀"
    - "感谢.*的(辣条|灯牌|点赞|礼物)"
    - "天(不见|没来)"
    - "要常来看直播哦"
    - "喜欢可以领牌牌"
    - "正缺个互动王"
    - "路过可以，错过"
    - "记得上次见还是在上次"

# 操作者：只有这个 uid 能触发 拉黑/切换人设/删历史 这类高权限工具
operator_uid: 1000000002

db: data/events.db
